name: agent-clippy-fix

on:
  push:
    branches:
      - agent/mok-fused-attention

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mok-fused-attention
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Stub nvcc for Rust-only linting
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fake-cuda/bin"
          cat > "$RUNNER_TEMP/fake-cuda/bin/nvcc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ " $* " == *" --version "* ]]; then
            echo "Cuda compilation tools, release 12.8, V12.8.61"
            exit 0
          fi
          out=""
          while (($#)); do
            if [[ "$1" == "-o" ]]; then
              out="$2"
              shift 2
            else
              shift
            fi
          done
          if [[ -z "$out" ]]; then
            echo "fake nvcc: missing -o" >&2
            exit 2
          fi
          printf '%s\n' '// fake PTX for Rust-only clippy validation' > "$out"
          EOF
          chmod +x "$RUNNER_TEMP/fake-cuda/bin/nvcc"
          echo "$RUNNER_TEMP/fake-cuda/bin" >> "$GITHUB_PATH"

      - name: Apply deterministic source fixes
        run: python3 .github/agent_fix_clippy.py

      - name: Apply machine-safe Clippy fixes
        run: cargo clippy --all-features --fix --allow-dirty --allow-staged

      - name: Format
        run: cargo fmt --all

      - name: Capture working diff
        if: always()
        shell: bash
        run: |
          git diff -- . ':(exclude).github/agent_fix_clippy.py' ':(exclude).github/workflows/agent-clippy-fix.yml' > "$RUNNER_TEMP/clippy-fix.patch"

      - name: Upload working diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-fix-patch
          path: ${{ runner.temp }}/clippy-fix.patch

      - name: Require clean Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Remove temporary fixer
        shell: bash
        run: |
          rm .github/agent_fix_clippy.py
          rm .github/workflows/agent-clippy-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix clippy diagnostics"
          git push origin HEAD:agent/mok-fused-attention
