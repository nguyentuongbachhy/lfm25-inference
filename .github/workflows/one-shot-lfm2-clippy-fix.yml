name: one-shot lfm2 clippy fix

on:
  push:
    branches:
      - agent/mok-fused-attention

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited lfm2 patch
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path("src/model/lfm2.rs")
          source = path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              "    Conv(ConvWeights),",
              "    Conv(Box<ConvWeights>),",
              "box Conv enum variant",
          )
          source = replace_once(
              source,
              "                OperatorWeights::Conv(ConvWeights {",
              "                OperatorWeights::Conv(Box::new(ConvWeights {",
              "box Conv constructor",
          )
          source = replace_once(
              source,
              "                })\n            };\n            layers.push(LayerWeights {",
              "                }))\n            };\n            layers.push(LayerWeights {",
              "close boxed Conv constructor",
          )

          start = source.index("    fn forward_logits_instrumented(")
          end = source.index("\n    fn short_conv(", start)
          head, section, tail = source[:start], source[start:end], source[end:]
          old = "        if let Some(capture) = capture.as_deref_mut() {\n            capture.observe_last_row(runtime, \"final_rms_norm\", &normalized)?;"
          section = replace_once(section, old, old.replace("capture.as_deref_mut()", "capture"), "final capture")
          old = "        if let Some(calibration) = calibration.as_deref_mut() {\n            calibration.observe_last_row(runtime, \"lm_head.input\", &normalized)?;"
          section = replace_once(section, old, old.replace("calibration.as_deref_mut()", "calibration"), "final calibration")
          old = "        let logits = profiled(\n            runtime,\n            profile.as_deref_mut(),\n            ProfileRegion::LmHead,"
          section = replace_once(section, old, old.replace("profile.as_deref_mut()", "profile"), "lm head profile")
          source = head + section + tail

          start = source.index("    fn short_conv(")
          end = source.index("\n    fn short_conv_batch(", start)
          head, section, tail = source[:start], source[start:end], source[end:]
          section = replace_once(section, "            mut calibration,", "            calibration,", "short conv calibration mut")
          section = replace_once(section, "        if let Some(calibration) = calibration.as_deref_mut() {", "        if let Some(calibration) = calibration {", "short conv calibration")
          old = "        profiled(\n            runtime,\n            profile.as_deref_mut(),\n            ProfileRegion::ConvOutProj,"
          section = replace_once(section, old, old.replace("profile.as_deref_mut()", "profile"), "conv out profile")
          source = head + section + tail

          start = source.index("    fn feed_forward(")
          end = source.index("\n    fn attention(", start)
          head, section, tail = source[:start], source[start:end], source[end:]
          old = "        if let Some(calibration) = calibration.as_deref_mut() {"
          if section.count(old) != 2:
              raise RuntimeError(f"feed-forward calibration: expected two matches, found {section.count(old)}")
          before, last = section.rsplit(old, 1)
          section = before + "        if let Some(calibration) = calibration {" + last
          old = "        profiled(\n            runtime,\n            profile.as_deref_mut(),\n            ProfileRegion::MlpDownGemm,"
          section = replace_once(section, old, old.replace("profile.as_deref_mut()", "profile"), "mlp down profile")
          source = head + section + tail

          start = source.index("    fn attention(")
          end = source.index("\n    fn attention_batch(", start)
          head, section, tail = source[:start], source[start:end], source[end:]
          section = replace_once(section, "            mut calibration,", "            calibration,", "attention calibration mut")
          section = replace_once(section, "        if let Some(calibration) = calibration.as_deref_mut() {", "        if let Some(calibration) = calibration {", "attention calibration")
          old = "        profiled(\n            runtime,\n            profile.as_deref_mut(),\n            ProfileRegion::AttnOutProj,"
          section = replace_once(section, old, old.replace("profile.as_deref_mut()", "profile"), "attention out profile")
          source = head + section + tail

          payload = source.encode()
          blob_sha = hashlib.sha1(f"blob {len(payload)}\0".encode() + payload).hexdigest()
          expected = "50acdfc7553fe63d037b8fa796a71ae8996520b2"
          if blob_sha != expected:
              raise RuntimeError(f"patched blob SHA mismatch: expected {expected}, got {blob_sha}")

          path.write_text(source)

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-lfm2-clippy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model/lfm2.rs .github/workflows/one-shot-lfm2-clippy-fix.yml
          git diff --cached --check
          git commit -m "fix remaining model clippy warnings"
          git push origin HEAD:agent/mok-fused-attention
